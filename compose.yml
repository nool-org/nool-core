name: nool-core

services:
  postgres:
    # postgres:16-alpine + pgvector - see database/postgres/Dockerfile.
    build:
      context: database/postgres
    image: nool-core-postgres:16-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nool_network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      # Jaeger's admin port (14269) has a dedicated health endpoint -
      # separate from the UI (16686) and the OTLP receiver (4318).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:14269/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - nool_network

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Fixed in-container path - see the volume mount below. The
      # host-side filename is whatever you actually have; only
      # FIREBASE_CREDENTIALS_HOST_PATH in .env needs to point at it.
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
      # Web API key - same value every frontend already ships as
      # NEXT_PUBLIC_FIREBASE_API_KEY (public by design). Needed here now
      # that POST /api/v1/login checks the password server-side instead
      # of the client calling Firebase directly.
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      # OTLP HTTP traces endpoint - see shared/tracing/setup.py. Internal
      # Docker-network address; never routed through NGINX.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      # Read-only Admin SDK service account - see services/auth/README.md.
      # Never commit the target file; ./secrets/ is gitignored.
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
      # Live source - bind-mounted over the image's COPY'd copy so a host
      # edit is visible in-container immediately; paired with --reload
      # below so uvicorn actually picks it up without a manual restart.
      # Local-dev convenience only - never done for a real deployment.
      - ./shared:/app/shared
      - ./services/auth/src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app/shared"]
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nool_network

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: core
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      KG_SERVICE_URL: http://kg:8000
      COLEARNER_SERVICE_URL: http://colearner:8000
      GENERATION_SERVICE_URL: http://generation:8000
      ASSET_BASE_URL: ${ASSET_BASE_URL:-http://localhost:10000/devstoreaccount1/question-assets}
      AI_MONTHLY_BUDGET_INR: ${AI_MONTHLY_BUDGET_INR:-}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
      # database/migrations is otherwise only COPY'd into the image at
      # build time - a migration generated via `./scripts/migrate.sh
      # revision --autogenerate` (which execs into this running
      # container) would only exist in that container's writable layer
      # and vanish on the next rebuild/recreate, never reaching the host
      # to be committed. Bind-mounting it makes generated migration files
      # land on the host immediately, like any other generated artifact.
      - ./database/migrations:/app/database/migrations
      # Live source - same reasoning/caveat as auth's mount above.
      - ./shared:/app/shared
      - ./services/core/src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app/shared"]
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nool_network

  kg:
    build:
      context: .
      dockerfile: services/kg/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: kg
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY_KG:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOOL_KG_BASE_URL: ${NOOL_KG_BASE_URL:-https://nool-data.draco-labs.in}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KG_MODEL: ${KG_MODEL:-gpt-5.1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ./shared:/app/shared
      - ./services/kg/src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app/shared"]
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nool_network

  # The AI gateway (LiteLLM proxy): every non-voice OpenAI call goes through it with
  # who/what it was for, and it keeps each call's cost - shared/llm_gateway.py,
  # litellm/config.yaml. UI: http://localhost:4000/ui (sign in with LITELLM_MASTER_KEY).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - nool_network

  # Stateless LLM question generation (LlamaIndex workflows) - see
  # services/generation/README.md. Only core calls it; it has no database.
  generation:
    build:
      context: .
      dockerfile: services/generation/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: generation
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY_GENERATION:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-5.1}
      VERIFY_MODEL: ${VERIFY_MODEL:-gpt-5-mini}
      TASK_MODELS: ${TASK_MODELS:-{}}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ./shared:/app/shared
      - ./services/generation/src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app/shared"]
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nool_network

  colearner:
    build:
      context: .
      dockerfile: services/colearner/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: colearner
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY_COLEARNER:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
      # Models are fixed in code - see services/colearner/README.md.
      # OPENAI_API_KEY is the same var kg already reads (see above); both
      # containers get their own copy of the same host value.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
      - ./shared:/app/shared
      - ./services/colearner/src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app/shared"]
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nool_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      auth:
        condition: service_healthy
      core:
        condition: service_healthy
      colearner:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx only listens on IPv4 here, but
      # localhost resolves to ::1 first in-container, which wget then
      # fails to connect to and reports as a false-negative failure.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nool_network

networks:
  nool_network:
    driver: bridge

# Persists across `docker compose down` / `up`. Only removed by
# `docker compose down -v`, which is destructive for local DB data.
volumes:
  postgres_data:
    name: nool_core_postgres_data
