# Forward the client's X-Request-ID if it sent one, otherwise fall back to
# nginx's own auto-generated request id.
map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

upstream auth_service {
    server auth:8000;
}

upstream core_service {
    server core:8000;
}

upstream colearner_service {
    server colearner:8000;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # CORS foundation - tighten Access-Control-Allow-Origin per environment
    # once nool-app's origins are known. No auth logic lives here; that
    # belongs to the Auth service.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;

    location /auth/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass http://auth_service;
    }

    # More specific than /api/ below (nginx matches the longest prefix
    # location, not declaration order) - colearner's own routers are
    # mounted at /api/v1/colearner/... (see
    # services/colearner/src/api/routes/realtime.py), same "no rewrite"
    # reasoning as /api/'s own comment, so requests here must never fall
    # through to core_service.
    location /api/v1/colearner/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://colearner_service;

        # Plain HTTP only (realtime audio goes app <-> OpenAI over WebRTC,
        # never through here). The longest call is realtime finish, which
        # runs the grader LLM - core waits up to 90s for it, so allow a bit
        # more; the SDP exchange is well under the server-level 30s default.
        proxy_read_timeout 120s;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        # No rewrite here, unlike /auth/ below: core's own routers are
        # already mounted at the full /api/v1/... path (see e.g.
        # school_admin.py's APIRouter(prefix="/api/v1/school", ...)), so
        # the incoming URI must reach core unchanged. Stripping /api/ (as
        # this location used to do) 404'd every business endpoint through
        # this gateway - only /health (mounted at root, outside /api/)
        # ever worked, which is why this went unnoticed.
        proxy_pass http://core_service;

        # WebSocket upgrade (core's /api/v1/ws/... curriculum and sync-progress
        # channels, api/routes/realtime.py) - see the $connection_upgrade
        # map in nginx.conf. Long read timeout since those sockets sit open
        # for minutes; harmless for plain REST calls under the same location.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        default_type application/json;
        return 502 '{"error":{"code":"BAD_GATEWAY","message":"Upstream service unavailable.","request_id":""}}';
    }
}
