# Local-development-only overrides, auto-loaded by `docker compose` alongside
# compose.yml (no extra flag needed). Not used in production - it only adds
# host ports for direct debugging/DB-client access that production must not
# expose. Delete or ignore this file for a production-shaped deploy.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"

  jaeger:
    ports:
      # Trace UI - http://localhost:16686
      - "${JAEGER_UI_PORT_HOST:-16686}:16686"

  auth:
    ports:
      # Direct access, bypassing NGINX - e.g. http://localhost:8001/docs
      # for the OpenAPI/Swagger UI. Same app the NGINX /auth/ route
      # forwards to; both work.
      - "${AUTH_PORT_HOST:-8001}:8000"

  core:
    ports:
      # Direct access, bypassing NGINX - e.g. http://localhost:8002/docs
      # for the OpenAPI/Swagger UI. Same app the NGINX /api/ route
      # forwards to; both work.
      - "${CORE_PORT_HOST:-8002}:8000"

  kg:
    ports:
      # Direct access - not routed through NGINX at all (see nginx/conf.d/
      # default.conf - only /auth/ and /api/ are proxied). Core reaches it
      # over the Compose network at http://kg:8000; this is only for
      # hitting its own /docs directly from the host.
      - "${KG_PORT_HOST:-8003}:8000"

  colearner:
    environment:
      # Dev-only test page at /api/v1/colearner/playground, no sign-in -
      # see services/colearner/src/api/deps.py.
      PLAYGROUND_ENABLED: "true"
    ports:
      # Direct access, bypassing NGINX - e.g. http://localhost:8004/docs
      # for the OpenAPI/Swagger UI. Same app the NGINX /api/v1/colearner/
      # route forwards to; both work.
      - "${COLEARNER_PORT_HOST:-8004}:8000"

  generation:
    ports:
      # Direct access, e.g. http://localhost:8005/docs - only core calls it otherwise.
      - "${GENERATION_PORT_HOST:-8005}:8000"

  # Local stand-in for Azure Blob Storage (question images - see
  # scripts/upload_assets.py). Production points AZURE_STORAGE_CONNECTION_STRING
  # / ASSET_BASE_URL at a real storage account instead; nothing else changes.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--loose"]
    ports:
      - "${AZURITE_BLOB_PORT_HOST:-10000}:10000"
    volumes:
      - azurite_data:/data
    networks:
      - nool_network

volumes:
  azurite_data:
