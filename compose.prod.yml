# Production overlay - use INSTEAD of compose.override.yml:
#
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#   docker compose -f compose.yml -f compose.prod.yml --profile kg-local up -d   # + local nool-kg
#
# What changes vs dev: code comes from the images (no source bind-mounts, no
# --reload - the Dockerfiles' own CMD runs), only nginx publishes host ports
# (80/443, TLS), migrations run as a one-shot "migrate" service before core
# starts, and a "backup" service takes a nightly pg_dump.
#
# Extra .env keys (all optional except the TLS files existing):
#   NGINX_SERVER_NAME        api.example.in (default "_")
#   NGINX_CERTS_DIR          host dir mounted at /etc/nginx/certs (default ./secrets/tls)
#   NGINX_SSL_CERT / _KEY    paths inside that mount (default fullchain.pem / privkey.pem)
#   ACME_WEBROOT             host dir served at /.well-known/acme-challenge/ (default ./secrets/acme-webroot)
#   NGINX_CORS_ORIGINS       "https://admin.example.in https://pm.example.in" - browser origins allowed
#   NGINX_API_RATE/_BURST, NGINX_AUTH_RATE/_BURST   per-IP limit_req settings
#   NGINX_HTTP_PORT / NGINX_HTTPS_PORT              host ports (default 80 / 443)
#   BACKUP_HOUR_UTC, BACKUP_KEEP_DAYS               nightly dump time / retention
#   NOOL_KG_BASE_URL, NOOL_KG_API_KEY, FALKORDB_*   see the nool-kg service below
#
# Let's Encrypt (host certbot, webroot mode):
#   certbot certonly --webroot -w "$ACME_WEBROOT" -d api.example.in
#   NGINX_CERTS_DIR=/etc/letsencrypt
#   NGINX_SSL_CERT=/etc/nginx/certs/live/api.example.in/fullchain.pem
#   NGINX_SSL_KEY=/etc/nginx/certs/live/api.example.in/privkey.pem
#   renew deploy hook: docker compose -f compose.yml -f compose.prod.yml exec nginx nginx -s reload

services:
  postgres:
    ports: !reset []

  jaeger:
    ports: !reset []

  migrate:
    # Same image/env as core; alembic.ini lives in /app/database - this is
    # exactly what scripts/migrate.sh runs in dev.
    build:
      context: .
      dockerfile: services/core/Dockerfile
    restart: "no"
    working_dir: /app/database
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nool_network

  auth:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !override
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
    ports: !reset []

  core:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !override
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
    ports: !reset []
    depends_on:
      migrate:
        condition: service_completed_successfully

  kg:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Defaults to the local nool-kg service below (--profile kg-local);
      # set NOOL_KG_BASE_URL in .env to use a remote nool-kg instead.
      NOOL_KG_BASE_URL: ${NOOL_KG_BASE_URL:-http://nool-kg:8000}
      NOOL_KG_API_KEY: ${NOOL_KG_API_KEY:-}
    volumes: !reset []
    ports: !reset []
    depends_on:
      nool-kg:
        condition: service_started
        required: false

  generation:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !reset []
    ports: !reset []

  colearner:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !override
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
    ports: !reset []

  # Textbook graph API (nool-kg repo, image built there as nool-kg:latest).
  # Optional: only started with --profile kg-local.
  nool-kg:
    image: nool-kg:latest
    profiles: ["kg-local"]
    restart: unless-stopped
    environment:
      NOOL_KG_API_KEY: ${NOOL_KG_API_KEY:-}
      FALKORDB_HOST: ${FALKORDB_HOST:-falkordb}
      FALKORDB_PORT: ${FALKORDB_PORT:-6379}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
    networks:
      - nool_network

  nginx:
    ports: !override
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_SSL_CERT: ${NGINX_SSL_CERT:-/etc/nginx/certs/fullchain.pem}
      NGINX_SSL_KEY: ${NGINX_SSL_KEY:-/etc/nginx/certs/privkey.pem}
      NGINX_CORS_ORIGINS: ${NGINX_CORS_ORIGINS:-}
      NGINX_API_RATE: ${NGINX_API_RATE:-30r/s}
      NGINX_API_BURST: ${NGINX_API_BURST:-60}
      NGINX_AUTH_RATE: ${NGINX_AUTH_RATE:-10r/m}
      NGINX_AUTH_BURST: ${NGINX_AUTH_BURST:-10}
    # No conf.d mount: the image renders templates/ into conf.d/ itself
    # (replacing its stock default.conf).
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/15-cors-origins.sh:/docker-entrypoint.d/15-cors-origins.sh:ro
      - ${NGINX_CERTS_DIR:-./secrets/tls}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-./secrets/acme-webroot}:/var/www/certbot:ro

  backup:
    # Same image as postgres so pg_dump's major version matches the server.
    build:
      context: database/postgres
    image: nool-core-postgres:16-pgvector
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nool_network

volumes:
  postgres_backups:
    name: nool_core_postgres_backups
