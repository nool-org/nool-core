# Production overlay - use INSTEAD of compose.override.yml:
#
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#   docker compose -f compose.yml -f compose.prod.yml --profile admin up -d      # + admin consoles
#   docker compose -f compose.yml -f compose.prod.yml --profile kg-local up -d   # + local nool-kg
#
# What changes vs dev: code comes from the images (no source bind-mounts, no
# --reload - the Dockerfiles' own CMD runs), only Caddy publishes host ports
# (80/443, automatic Let's Encrypt TLS - see caddy/Caddyfile) in front of
# nginx, migrations run as a one-shot "migrate" service before core starts,
# a "backup" service takes a nightly pg_dump, and the colearner playground
# is forced off. No azurite (dev-only, compose.override.yml).
#
# Every .env key is listed in .env.production.example; the step-by-step
# server runbook is docs/DEPLOY_HOSTINGER.md.

services:
  postgres:
    ports: !reset []

  jaeger:
    ports: !reset []
    environment:
      # In-memory store, internal only (no published port) - cap it so a
      # long-running server doesn't grow it without bound.
      MEMORY_MAX_TRACES: ${JAEGER_MAX_TRACES:-20000}

  migrate:
    # Same image/env as core; alembic.ini lives in /app/database - this is
    # exactly what scripts/migrate.sh runs in dev.
    build:
      context: .
      dockerfile: services/core/Dockerfile
    restart: "no"
    working_dir: /app/database
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nool_network

  auth:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !override
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
    ports: !reset []

  core:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !override
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
    ports: !reset []
    depends_on:
      migrate:
        condition: service_completed_successfully

  kg:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Defaults to the local nool-kg service below (--profile kg-local);
      # set NOOL_KG_BASE_URL in .env to use a remote nool-kg instead.
      NOOL_KG_BASE_URL: ${NOOL_KG_BASE_URL:-http://nool-kg:8000}
      NOOL_KG_API_KEY: ${NOOL_KG_API_KEY:-}
    volumes: !reset []
    ports: !reset []
    depends_on:
      nool-kg:
        condition: service_started
        required: false

  generation:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes: !reset []
    ports: !reset []

  colearner:
    command: !reset null
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PLAYGROUND_ENABLED: "false"
    volumes: !override
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-./secrets/firebase-service-account.json}:/app/secrets/firebase-service-account.json:ro
    ports: !reset []

  # Textbook graph API (nool-kg repo, image built there as nool-kg:latest).
  # Optional: only started with --profile kg-local.
  nool-kg:
    image: nool-kg:latest
    profiles: ["kg-local"]
    restart: unless-stopped
    environment:
      NOOL_KG_API_KEY: ${NOOL_KG_API_KEY:-}
      FALKORDB_HOST: ${FALKORDB_HOST:-falkordb}
      FALKORDB_PORT: ${FALKORDB_PORT:-6379}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
    networks:
      - nool_network

  nginx:
    # Internal only - Caddy below is the public entry point and proxies here.
    ports: !reset []
    environment:
      NGINX_CORS_ORIGINS: ${NGINX_CORS_ORIGINS:-}
      NGINX_API_RATE: ${NGINX_API_RATE:-30r/s}
      NGINX_API_BURST: ${NGINX_API_BURST:-60}
      NGINX_AUTH_RATE: ${NGINX_AUTH_RATE:-10r/m}
      NGINX_AUTH_BURST: ${NGINX_AUTH_BURST:-10}
    # No conf.d mount: the image renders templates/ into conf.d/ itself
    # (replacing its stock default.conf).
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/15-cors-origins.sh:/docker-entrypoint.d/15-cors-origins.sh:ro

  # TLS termination + http->https redirect for every public hostname - see
  # caddy/Caddyfile. The only service with host ports.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      SCHOOL_ADMIN_DOMAIN: ${SCHOOL_ADMIN_DOMAIN:?set SCHOOL_ADMIN_DOMAIN in .env}
      SUPER_ADMIN_DOMAIN: ${SUPER_ADMIN_DOMAIN:?set SUPER_ADMIN_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates + ACME account - must persist, or every restart
      # re-issues and soon hits Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API - bound to 127.0.0.1 inside the container only
      # (global options in caddy/Caddyfile).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nool_network

  # Admin consoles - images built in their own repos (nool-school-admin,
  # nool-super-admin: `docker compose build` there with the production
  # NEXT_PUBLIC_* values, which are baked in at build time). Only started
  # with --profile admin; reached solely through Caddy, no host ports.
  school-admin:
    image: nool-school-admin-web:latest
    profiles: ["admin"]
    restart: unless-stopped
    networks:
      - nool_network

  super-admin:
    image: nool-super-admin-web:latest
    profiles: ["admin"]
    restart: unless-stopped
    networks:
      - nool_network

  backup:
    # Same image as postgres so pg_dump's major version matches the server.
    build:
      context: database/postgres
    image: nool-core-postgres:16-pgvector
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nool_network

volumes:
  postgres_backups:
    name: nool_core_postgres_backups
  caddy_data:
    name: nool_core_caddy_data
  caddy_config:
    name: nool_core_caddy_config
